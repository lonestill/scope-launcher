name: Release

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to release (e.g. 2.0.0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      pending: ${{ steps.pending.outputs.value }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for unreleased commits
        id: pending
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -z "$LATEST_TAG" ]] || [[ "$(git rev-list --count "${LATEST_TAG}..HEAD")" -gt 0 ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: changes
    if: needs.changes.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and renderer build
        run: npm run check

      - name: Determine release version
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            npm version "$INPUT_VERSION" --no-git-tag-version --allow-same-version
          else
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
            if ! git rev-parse --verify --quiet "refs/tags/v${CURRENT_VERSION}"; then
              echo "Releasing current unreleased version v${CURRENT_VERSION}"
            else
              echo "Tag v${CURRENT_VERSION} already exists, bumping patch..."
              npm version patch --no-git-tag-version
            fi
          fi
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit version and create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -a "${TAG}" -m "Scope Launcher ${TAG}"
          git push origin "${TAG}"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use commit time for deterministic archives
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build Linux artifacts
        run: npm run dist:linux:all

      - name: Create Linux checksums
        working-directory: release
        run: sha256sum --binary *.AppImage *.deb *.tar.gz > SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: onyx-launcher-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npm run dist:windows

      - name: Create Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $assetName = $_.Name.Replace(" ", ".")
            "$hash *$assetName"
          } | Set-Content -LiteralPath release/SHA256SUMS-windows.txt -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: onyx-launcher-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        run: npm run dist:mac

      - name: Create macOS checksums
        working-directory: release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: onyx-launcher-macos
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Scope Launcher ${VERSION}"
